<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamil Crackers Shop</title>
  <style>
    /* Basic Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #2c0735, #6a0dad);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      background: rgba(0,0,0,0.6);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      max-width: 500px;
      width: 100%;
      animation: fadeIn 1s ease-in-out;
    }

    img {
      width: 100%;
      height: auto;
      border-radius: 15px;
      transition: transform 0.5s, box-shadow 0.5s;
    }

    img:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(255,165,0,0.6);
    }

    .order-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 35px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: linear-gradient(45deg, #ff5722, #ff9800);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: 0.4s;
      box-shadow: 0 8px 20px rgba(255,87,34,0.5);
    }

    .order-btn:hover {
      background: linear-gradient(45deg, #e64a19, #ffb74d);
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(255,87,34,0.7);
    }

    @keyframes fadeIn {
      0% {opacity: 0; transform: translateY(-20px);}
      100% {opacity: 1; transform: translateY(0);}
    }

    /* Responsive text */
    @media (max-width: 600px) {
      .order-btn {
        padding: 12px 25px;
        font-size: 18px;
      }
      .container {
        padding: 15px;
      }
    }
  </style>
</head>

  </div>
</body>
</html>
